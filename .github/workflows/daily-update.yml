# GSMA Open Gateway 情报站 - 每日自动更新工作流
# 每日 10:00 (UTC+8) / 02:00 (UTC) 自动触发数据抓取
name: Daily Data Update

on:
  schedule:
    # UTC 00:00 = 北京时间 08:00 (提前2小时,给GitHub延迟留余量)
    - cron: '0 0 * * *'
    # UTC 04:00 = 北京时间 12:00 (补跑一次)
    - cron: '0 4 * * *'
  # 支持手动触发
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "daily-update"
  cancel-in-progress: false

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run data fetch script
        run: python scripts/fetch_data.py
        continue-on-error: true

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes detected."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected, will commit and deploy."
          fi

      - name: Commit and push changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data.js camara_releases.json
          git commit -m "data: daily auto-update $(date -u +%Y-%m-%d)"
          git push

      - name: Setup Pages
        if: steps.changes.outputs.changed == 'true'
        uses: actions/configure-pages@v4

      - name: Upload artifact
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        if: steps.changes.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: No changes - skip deploy
        if: steps.changes.outputs.changed == 'false'
        run: echo "No data changes today, skipping deployment."
