# GitHub Pages 部署工作流 - push 时触发
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同组并发时取消进行中的旧部署, 只部署最新 push。
# 原因: upload-pages-artifact 会上传并清理同名 "github-pages" artifact,
# 密集连续 push 时旧运行会因 artifact 被清理而报 "No artifacts named github-pages"。
# 对新闻站而言只有最新内容需要部署, 取消旧运行是安全且必要的。
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
